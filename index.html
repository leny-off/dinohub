<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DinoHub – Dinosaures Réalistes</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
body{background:#f7f4ff;color:#333;}
a{text-decoration:none;color:inherit;}

/* HEADER */
header{
    background:#fff;
    padding:16px 40px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid #e5dfff;
}
.logo{
    display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;
    color:#a06bff;
}
.logo-badge{
    background:#d7b3ff;color:#fff;padding:4px 10px;border-radius:4px;font-size:18px;
}
nav{display:flex;gap:20px;font-size:15px;}
nav a{color:#a06bff;}
nav a:hover{color:#7a3fff;}
.search-bar input{
    background:#f0e8ff;border:1px solid #d8caff;color:#333;
    padding:6px 10px;border-radius:999px;width:190px;font-size:14px;
}

/* MOBILE */
.menu-btn{display:none;font-size:26px;cursor:pointer;color:#a06bff;}
@media(max-width:800px){
    header{padding:12px 16px;}
    nav{
        display:none;flex-direction:column;position:absolute;top:60px;right:10px;
        background:#fff;border:1px solid #e5dfff;border-radius:8px;padding:12px 16px;
    }
    nav.open{display:flex;}
    .menu-btn{display:block;}
}

/* HERO */
.hero{
    padding:70px 40px 40px;
    background:linear-gradient(to bottom,#f3e7ff,#f7f4ff);
}
.hero-tag{
    display:inline-block;background:#d7b3ff;color:#fff;
    padding:4px 10px;border-radius:999px;font-size:12px;margin-bottom:12px;
}
.hero-title{
    font-size:42px;font-weight:800;margin-bottom:10px;color:#7a3fff;
}
.hero-subtitle{
    color:#6a5a8a;font-size:17px;max-width:520px;margin-bottom:20px;
}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
.btn-primary{
    background:#a06bff;color:#fff;padding:10px 18px;border-radius:4px;
    font-weight:600;font-size:14px;cursor:pointer;border:none;
}
.btn-primary:hover{background:#7a3fff;}
.btn-ghost{
    background:transparent;color:#7a3fff;padding:10px 18px;border-radius:4px;
    border:1px solid #cbb3ff;font-size:14px;cursor:pointer;
}
.btn-ghost:hover{border-color:#a06bff;}

/* SECTION */
.section{padding:20px 40px 40px;}
.section-title{font-size:22px;font-weight:700;margin-bottom:16px;color:#7a3fff;}

/* GRID */
.video-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
}
.card{
    background:#fff;border-radius:12px;overflow:hidden;
    cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;
    border:1px solid #e5dfff;
}
.card:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 14px 30px rgba(160,107,255,.25);
}
.thumb{
    position:relative;height:160px;background:#f0e8ff;background-size:cover;background-position:center;
}
.thumb-tag{
    position:absolute;left:10px;bottom:10px;
    background:#d7b3ff;color:#fff;font-size:11px;
    padding:3px 8px;border-radius:999px;
}
.fav-btn{
    position:absolute;top:8px;right:8px;
    background:rgba(255,255,255,.8);width:30px;height:30px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:17px;color:#ffcc33;cursor:pointer;
}
.fav-btn.inactive{color:#bbb;}
.card-body{padding:10px 12px 12px;}
.card-title{font-size:15px;font-weight:600;margin-bottom:4px;color:#7a3fff;}
.card-meta{
    font-size:12px;color:#6a5a8a;display:flex;justify-content:space-between;align-items:center;
}

/* MODAL PHOTO */
#photoModal{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.65);backdrop-filter:blur(4px);
    justify-content:center;align-items:center;z-index:50;
}
.modal-inner{
    width:92%;max-width:700px;
}
.modal-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;color:#fff;
}
.modal-title{font-size:18px;font-weight:600;}
.close-btn{
    font-size:26px;cursor:pointer;color:#fff;
}
.modal-img{
    width:100%;border-radius:12px;
}

/* FOOTER */
footer{
    padding:18px 40px;background:#fff;border-top:1px solid #e5dfff;
    display:flex;justify-content:space-between;align-items:center;
    color:#7a3fff;font-size:13px;
}
footer a{color:#a06bff;}
footer a:hover{color:#7a3fff;}
</style>

<script>
/* ————————————————————————————————
   IMAGES RÉALISTES MODERNES (Imgur)
——————————————————————————————— */

const dinos = {
    trex:{
        title:"Tyrannosaurus Rex",
        tag:"Carnivore",
        duration:"Image",
        rating:"4.9 ★",
        thumb:"https://i.imgur.com/8pQn8mC.jpeg",
        photo:"https://i.imgur.com/8pQn8mC.jpeg"
    },
    triceratops:{
        title:"Tricératops",
        tag:"Herbivore",
        duration:"Image",
        rating:"4.7 ★",
        thumb:"https://i.imgur.com/1z0p0mR.jpeg",
        photo:"https://i.imgur.com/1z0p0mR.jpeg"
    },
    velociraptor:{
        title:"Vélociraptor",
        tag:"Prédateur rapide",
        duration:"Image",
        rating:"4.8 ★",
        thumb:"https://i.imgur.com/8x0xJcD.jpeg",
        photo:"https://i.imgur.com/8x0xJcD.jpeg"
    },
    mosasaurus:{
        title:"Mosasaurus",
        tag:"Monstre marin",
        duration:"Image",
        rating:"4.9 ★",
        thumb:"https://i.imgur.com/0p6yq1U.jpeg",
        photo:"https://i.imgur.com/0p6yq1U.jpeg"
    },
    pteranodon:{
        title:"Ptéranodon",
        tag:"Volant",
        duration:"Image",
        rating:"4.6 ★",
        thumb:"https://i.imgur.com/3y4v0pP.jpeg",
        photo:"https://i.imgur.com/3y4v0pP.jpeg"
    },
    ankylosaurus:{
        title:"Ankylosaurus",
        tag:"Blindé",
        duration:"Image",
        rating:"4.5 ★",
        thumb:"https://i.imgur.com/7m8Q2pS.jpeg",
        photo:"https://i.imgur.com/7m8Q2pS.jpeg"
    }
};

let favs = JSON.parse(localStorage.getItem("dinoFavs") || "[]");

function toggleFav(key,event){
    event.stopPropagation();
    if(favs.includes(key)){
        favs = favs.filter(f=>f!==key);
    }else{
        favs.push(key);
    }
    localStorage.setItem("dinoFavs",JSON.stringify(favs));
    renderCards();
}

function openPhoto(key){
    const d = dinos[key];
    document.getElementById("photoTitle").innerText = d.title;
    document.getElementById("photoImg").src = d.photo;
    document.getElementById("photoModal").style.display = "flex";
}

function closePhoto(){
    document.getElementById("photoModal").style.display = "none";
}

function renderCards(filter=""){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const q = filter.toLowerCase();

    Object.keys(dinos).forEach(key=>{
        const d = dinos[key];
        if(q && !d.title.toLowerCase().includes(q) && !d.tag.toLowerCase().includes(q)) return;

        const isFav = favs.includes(key);
        grid.innerHTML += `
        <div class="card" onclick="openPhoto('${key}')">
            <div class="thumb" style="background-image:url('${d.thumb}')">
                <span class="thumb-tag">${d.tag}</span>
                <div class="fav-btn ${isFav ? "" : "inactive"}" onclick="toggleFav('${key}',event)">★</div>
            </div>
            <div class="card-body">
                <div class="card-title">${d.title}</div>
                <div class="card-meta">
                    <span>${d.duration}</span>
                    <span>${d.rating}</span>
                </div>
            </div>
        </div>`;
    });
}

function searchDinos(){
    const val = document.getElementById("search").value;
    renderCards(val);
}

function toggleMenu(){
    document.querySelector("nav").classList.toggle("open");
}

window.onload = ()=>{ renderCards(); };
</script>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-badge">Dino</div>Hub
    </div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <nav>
        <a href="#">Accueil</a>
        <a href="#videos">Galerie</a>
    </nav>

    <div class="search-bar">
        <input id="search" type="text" placeholder="Rechercher un dinosaure..." onkeyup="searchDinos()">
    </div>
</header>

<section class="hero">
    <div class="hero-tag">Nouveau • Galerie réaliste moderne</div>
    <h1 class="hero-title">Les dinosaures comme vous ne les avez jamais vus.</h1>
    <p class="hero-subtitle">
        Illustrations réalistes modernes, sélectionnées spécialement pour DinoHub.
    </p>
    <div class="hero-actions">
        <button class="btn-primary" onclick="document.getElementById('videos').scrollIntoView({behavior:'smooth'})">
            🦕 Voir la galerie
        </button>
        <button class="btn-ghost">
            ★ Voir mes favoris
        </button>
    </div>
</section>

<section class="section" id="videos">
    <h2 class="section-title">Dinosaures réalistes modernes</h2>
    <div class="video-grid" id="grid"></div>
</section>

<div id="photoModal">
    <div class="modal-inner">
        <div class="modal-header">
            <div class="modal-title" id="photoTitle"></div>
            <div class="close-btn" onclick="closePhoto()">✕</div>
        </div>
        <img id="photoImg" class="modal-img">
    </div>
</div>

<footer>
    <div>© 2026 DinoHub – Illustrations réalistes modernes</div>
    <div><a href="#">Contact</a></div>
</footer>

</body>
</html>
