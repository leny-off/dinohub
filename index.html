<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DinoHub - Le royaume des dinosaures">

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#0d0d0d;color:#eee;}

/* HEADER */
header{
    background:#000;padding:15px 25px;
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;z-index:20;
}
.logo{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:bold;}
.logo-box{background:#e50914;color:#fff;padding:4px 8px;border-radius:3px;}
nav{display:flex;gap:20px;}
nav a{color:#ccc;font-size:15px;}
nav a:hover{color:#fff;}
.menu-btn{display:none;font-size:28px;cursor:pointer;color:#fff;}

@media(max-width:800px){
    nav{
        display:none;flex-direction:column;background:#000;
        position:absolute;top:60px;right:0;padding:20px;width:200px;
    }
    nav.open{display:flex;}
    .menu-btn{display:block;}
}

/* HERO */
.hero{
    padding:60px 30px;
    background:url('https://i.imgur.com/8uZq0qT.jpeg') center/cover no-repeat;
    background-blend-mode:darken;
    background-color:#000a;
}
.hero-title{font-size:42px;font-weight:bold;margin-bottom:10px;}
.hero-subtitle{color:#ccc;font-size:18px;}

/* GRID */
.section{padding:30px;}
.section-title{font-size:24px;margin-bottom:16px;}
.video-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}
.card{
    background:#111;border-radius:6px;overflow:hidden;
    cursor:pointer;transition:.2s;position:relative;
}
.card:hover{transform:scale(1.05);}
.thumb{
    height:140px;background-size:cover;background-position:center;
}
.card-body{padding:10px;}
.card-title{font-size:15px;margin-bottom:6px;}
.card-meta{font-size:12px;color:#aaa;display:flex;justify-content:space-between;}

/* FAVORIS */
.fav-btn{
    position:absolute;top:8px;right:8px;
    background:#000a;padding:6px;border-radius:50%;cursor:pointer;
    font-size:18px;color:#e50914;
}
.fav-btn.active{color:#ffd700;}

/* MODALE VIDEO */
#videoModal{
    display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:#000d;backdrop-filter:blur(4px);
    justify-content:center;align-items:center;z-index:50;
}
.modal-content{
    width:90%;max-width:900px;
}
iframe{
    width:100%;height:500px;border:none;border-radius:6px;
}
.close-btn{
    color:#fff;font-size:30px;cursor:pointer;
    position:absolute;top:20px;right:40px;
}

/* FOOTER */
footer{
    padding:20px;background:#000;color:#777;
    display:flex;justify-content:space-between;
}
</style>

<script>
/* BASE DE DONNÉES */
const dinos = {
    trex:{
        title:"Tyrannosaurus Rex",
        tag:"Carnivore",
        duration:"12 min",
        rating:"4.8 ★",
        thumb:"https://i.imgur.com/0Y8FQ0M.jpeg",
        video:"https://www.youtube.com/embed/QxZ_iPldGtI"
    },
    triceratops:{
        title:"Tricératops",
        tag:"Herbivore",
        duration:"9 min",
        rating:"4.6 ★",
        thumb:"https://i.imgur.com/3mJxq6C.jpeg",
        video:"https://www.youtube.com/embed/1F9FQdZkY9E"
    },
    velociraptor:{
        title:"Vélociraptor",
        tag:"Rapide",
        duration:"7 min",
        rating:"4.7 ★",
        thumb:"https://i.imgur.com/2vZ8q2F.jpeg",
        video:"https://www.youtube.com/embed/QxZ_iPldGtI?t=40"
    },
    mosasaurus:{
        title:"Mosasaurus",
        tag:"Aquatique",
        duration:"11 min",
        rating:"4.9 ★",
        thumb:"https://i.imgur.com/1p5Y0vL.jpeg",
        video:"https://www.youtube.com/embed/Vn8phH0k5HI"
    },
    pteranodon:{
        title:"Ptéranodon",
        tag:"Volant",
        duration:"6 min",
        rating:"4.5 ★",
        thumb:"https://i.imgur.com/6u8Y0QH.jpeg",
        video:"https://www.youtube.com/embed/0Gxv3Zqkq5Q"
    },
    ankylosaurus:{
        title:"Ankylosaurus",
        tag:"Armuré",
        duration:"8 min",
        rating:"4.4 ★",
        thumb:"https://i.imgur.com/7t9Y0pS.jpeg",
        video:"https://www.youtube.com/embed/5n3ZQvZkY9E"
    }
};

/* FAVORIS */
let favs = JSON.parse(localStorage.getItem("favs") || "[]");

function toggleFav(dino){
    if(favs.includes(dino)){
        favs = favs.filter(f=>f!==dino);
    } else {
        favs.push(dino);
    }
    localStorage.setItem("favs", JSON.stringify(favs));
    renderCards();
}

/* AFFICHAGE DES CARTES */
function renderCards(){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    Object.keys(dinos).forEach(key=>{
        const d = dinos[key];
        const fav = favs.includes(key) ? "active" : "";

        grid.innerHTML += `
        <div class="card" onclick="openVideo('${key}')">
            <div class="thumb" style="background-image:url('${d.thumb}')"></div>
            <div class="fav-btn ${fav}" onclick="event.stopPropagation(); toggleFav('${key}')">★</div>
            <div class="card-body">
                <div class="card-title">${d.title}</div>
                <div class="card-meta"><span>${d.duration}</span><span>${d.rating}</span></div>
            </div>
        </div>`;
    });
}

/* MODALE VIDEO */
function openVideo(dino){
    const d = dinos[dino];
    document.getElementById("videoFrame").src = d.video;
    document.getElementById("videoModal").style.display = "flex";
}

function closeVideo(){
    document.getElementById("videoFrame").src = "";
    document.getElementById("videoModal").style.display = "none";
}

/* RECHERCHE */
function searchDinos(){
    const input = document.getElementById("search").value.toLowerCase();
    const cards = document.querySelectorAll(".card");

    cards.forEach(card=>{
        const title = card.querySelector(".card-title").innerText.toLowerCase();
        card.style.display = title.includes(input) ? "block" : "none";
    });
}

/* MENU MOBILE */
function toggleMenu(){
    document.querySelector("nav").classList.toggle("open");
}

/* INIT */
window.onload = ()=>{ renderCards(); };
</script>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-box">Dino</div>Hub
    </div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <nav>
        <a href="#">Accueil</a>
        <a href="#videos">Vidéos</a>
    </nav>

    <div class="search-bar">
        <input id="search" type="text" placeholder="Rechercher..." onkeyup="searchDinos()">
    </div>
</header>

<section class="hero">
    <h1 class="hero-title">Le meilleur des dinosaures.</h1>
    <p class="hero-subtitle">Documentaires, fiches, vidéos… tout est là.</p>
</section>

<section class="section" id="videos">
    <h2 class="section-title">Dinosaures populaires</h2>
    <div class="video-grid" id="grid"></div>
</section>

<!-- MODALE VIDEO -->
<div id="videoModal">
    <div class="close-btn" onclick="closeVideo()">✖</div>
    <div class="modal-content">
        <iframe id="videoFrame" allowfullscreen></iframe>
    </div>
</div>

<footer>
    <div>© 2026 DinoHub</div>
    <div><a href="#">Contact</a></div>
</footer>

</body>
</html>
